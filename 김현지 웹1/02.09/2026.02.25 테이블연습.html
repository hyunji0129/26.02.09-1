    <h2>학생 정보 테이블</h2>
    <table>
        <tr>
            <th>이름</th>
            <th>나이</th>
            <th>전공</th>
        </tr>
        <tr>
            <td>홍길동</td>
            <td>20</td>
            <td>컴퓨터공학</td>
        </tr>
        <tr>
            <td>김영희</td>
            <td>22</td>
            <td>디자인</td>
        </tr>
        <tr>

            <td>21</td>
            <td>경영학</td>
        </tr>

    <table>
        <tr>
            <th colspan="2">이름 + 나이</th>

            <td colspan="2">홍길동 + 20</td>
            <td>컴퓨터공학</td>
        </tr>
        <tr>
